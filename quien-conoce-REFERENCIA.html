<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio de Personal Capacitado — RescueChip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E8231A;
    --red-dark:#B31F1B;
    --pink-bg:#F5E3E2;
    --pink-text:#C94A45;
    --black:#0C0B09;
    --green:#2FA758;
    --green-bg:#E4F5EA;
    --bg:#FFFFFF;
    --card:#EDECE8;
    --card-soft:#F5F4F1;
    --grey:#6B6B66;
    --hair: rgba(10,10,8,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* Modo oscuro deshabilitado a propósito: el directorio siempre usa la paleta clara */
    }
  }


  .watermark{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:70vmin;
    max-width:640px;
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', -apple-system, sans-serif;
    min-height:100vh;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:24px 18px 60px 18px;
    position:relative;
    z-index:1;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
  }
  .topbar img{ height:88px; }

  h1{
    font-size:26px;
    font-weight:800;
    color:var(--black);
    margin:0 0 6px 0;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--grey);
    font-size:14px;
    line-height:1.55;
    margin:0 0 18px 0;
  }
  .status-line{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13.5px;
    color:var(--grey);
    margin-bottom:18px;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--green);
    flex-shrink:0;
  }
  .status-line b{ color:var(--green); font-weight:700; }

  .card{
    background:var(--card);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:14px;
  }

  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:14px 18px;
    margin-bottom:14px;
  }
  .search-box svg{ flex-shrink:0; color:var(--grey); }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--black);
    width:100%;
  }
  .search-box input::placeholder{ color:var(--grey); font-weight:400; }

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .tab{
    font-size:13px;
    font-weight:600;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--hair);
    color:var(--grey);
    cursor:pointer;
    user-select:none;
  }
  .tab.active{
    background:var(--red);
    color:#FFFFFF;
    border-color:var(--red);
  }
  .tab .count{ opacity:0.75; margin-left:3px; }

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .stat{
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:14px 8px;
    text-align:center;
  }
  .stat .n{ font-size:19px; font-weight:800; color:var(--red); }
  .stat .l{ font-size:10px; color:var(--grey); margin-top:2px; font-weight:500; }

  .section-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--grey);
    margin:4px 4px 10px 4px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:8px;
  }
  .row .info{ flex:1; min-width:0; }
  .row .nombre{
    font-size:14.5px;
    font-weight:700;
    color:var(--black);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .folio-line{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:5px;
  }
  .folio-badge{
    font-size:11px;
    font-weight:700;
    color:var(--pink-text);
    background:var(--pink-bg);
    padding:3px 9px;
    border-radius:999px;
    letter-spacing:0.01em;
  }
  .row .fecha-inline{
    font-size:11px;
    color:var(--grey);
  }
  .row .right{
    text-align:right;
    flex-shrink:0;
  }
  .org-pill{
    font-size:11px;
    font-weight:700;
    color:var(--black);
    background:var(--hair);
    padding:4px 10px;
    border-radius:999px;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--grey);
  }
  .empty svg{ opacity:0.35; margin-bottom:10px; }
  .empty p{ font-size:13.5px; margin:0; }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--grey);
    margin-top:26px;
    font-weight:500;
  }
  footer b{ color:var(--black); }
</style>
</head>

let activeOrg = 'Todas';
let query = '';


function renderTabs(){
  const orgs = ['Todas', ...Array.from(new Set(DATA.map(d=>d.org)))];
  const el = document.getElementById('tabs');
  el.innerHTML = orgs.map(org=>{
    const count = org==='Todas' ? DATA.length : DATA.filter(d=>d.org===org).length;
    return `<div class="tab ${org===activeOrg?'active':''}" data-org="${org}">${org} <span class="count">${count}</span></div>`;
  }).join('');
  el.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ activeOrg=t.dataset.org; renderTabs(); renderResults(); });
  });
}

function renderStats(){
  const orgs = new Set(DATA.map(d=>d.org));
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${DATA.length}</div><div class="l">Capacitados</div></div>
    <div class="stat"><div class="n">${orgs.size}</div><div class="l">Organización${orgs.size===1?'':'es'}</div></div>
    <div class="stat"><div class="n">Ago 2026</div><div class="l">Última sesión</div></div>
  `;
}

function renderResults(){
  const q = query.trim().toLowerCase();
  let filtered = DATA.filter(d=> activeOrg==='Todas' || d.org===activeOrg);
  if(q){
    filtered = filtered.filter(d => d.nombre.toLowerCase().includes(q) || d.folio.toLowerCase().includes(q));
  }
  filtered = filtered.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));

  document.getElementById('resultsLabel').textContent = `${filtered.length} resultado${filtered.length===1?'':'s'}`;

  const list = document.getElementById('resultsList');
  const empty = document.getElementById('emptyState');
  if(filtered.length===0){ list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  list.innerHTML = filtered.map(d => `
    <div class="row">
      <div class="info">
        <div class="nombre">${d.nombre}</div>
        <div class="folio-line">
          <span class="folio-badge">${d.folio}</span>
          <span class="fecha-inline">${d.fecha}</span>
        </div>
      </div>
      <div class="right">
        <span class="org-pill">${d.org}</span>
      </div>
    </div>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', e=>{
  query = e.target.value;
  renderResults();
});

renderTabs();
renderStats();
renderResults();
</script>
